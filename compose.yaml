services:
  redis:
    image: docker.io/library/redis:8.6.5-alpine
    container_name: one-shot-omniroute-redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - ${DATA_DIR}/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
  omniroute:
    image: diegosouzapw/omniroute:${OMNIROUTE_VERSION}
    container_name: one-shot-omniroute
    restart: unless-stopped
    init: true
    stop_grace_period: 40s
    env_file: .env
    environment:
      DATA_DIR: /app/data
      REDIS_URL: redis://redis:6379
      OMNIROUTE_MEMORY_MB: ${OMNIROUTE_MEMORY_MB}
    ports:
      - "127.0.0.1:${DASHBOARD_PORT}:${DASHBOARD_PORT}"
      - "127.0.0.1:${API_PORT}:${API_PORT}"
      - "127.0.0.1:${LIVE_WS_PORT}:${LIVE_WS_PORT}"
    volumes:
      - ${DATA_DIR}/app:/app/data
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "healthcheck.mjs"]
      interval: 30s
      timeout: 8s
      retries: 5
      start_period: 45s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"
